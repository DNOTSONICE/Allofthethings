<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e7490">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wet Check">
  <title>Wet Check</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <button id="back" class="icon-btn" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="bar-text">
      <nav id="crumbs" class="crumbs" hidden></nav>
      <h1 id="title">Properties</h1>
      <div id="subtitle" class="subtitle" hidden></div>
    </div>
    <button id="header-more" class="icon-btn end" aria-label="Report options" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="19" r="2" fill="currentColor"/></svg>
    </button>
  </header>

  <main>
    <section id="folder-view" hidden>
      <ul id="folder-list" class="list"></ul>
      <h2 id="reports-heading" class="section-title" hidden>Wet check reports</h2>
      <ul id="report-list" class="list"></ul>
      <p id="folder-empty" class="empty" hidden>Nothing here yet. Tap <strong>New</strong> to add a folder or a wet check report.</p>
    </section>

    <section id="report-view" hidden>
      <div id="finding-groups"></div>
      <p id="report-empty" class="empty" hidden>No findings yet. Set the zone you're starting in below, then tap <strong>Add finding</strong>.</p>

      <div class="zone-panel">
        <div class="zone-row">
          <button id="zone-prev" class="zone-step" aria-label="Previous zone">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="zone-current" class="zone-current" aria-label="Change current zone">
            <span class="zone-caption">Working in</span>
            <span id="zone-value" class="zone-value">Zone 1</span>
          </button>
          <button id="zone-next" class="zone-step" aria-label="Next zone">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <button id="add-finding" class="btn primary add-finding">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          <span id="add-finding-label">Add finding to Zone 1</span>
        </button>
      </div>
    </section>
  </main>

  <button id="fab" class="fab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    <span id="fab-label">New</span>
  </button>

  <dialog id="name-dialog">
    <form data-ok>
      <h2 id="name-title">New folder</h2>
      <input id="name-input" class="field" type="text" autocomplete="off" autocapitalize="words" enterkeyhint="done" placeholder="Folder name" required maxlength="120">
      <div class="actions">
        <button type="button" class="btn" onclick="this.closest('dialog').close('cancel')">Cancel</button>
        <button id="name-submit" type="submit" class="btn primary">Create</button>
      </div>
    </form>
  </dialog>

  <dialog id="report-dialog">
    <form data-ok>
      <h2 id="report-dialog-title">New wet check report</h2>
      <label class="label" for="report-name">Report name</label>
      <input id="report-name" class="field" type="text" autocomplete="off" autocapitalize="sentences" required maxlength="120">
      <label class="label" for="report-date">Date</label>
      <input id="report-date" class="field" type="date" required>
      <div class="actions">
        <button type="button" class="btn" onclick="this.closest('dialog').close('cancel')">Cancel</button>
        <button id="report-submit" type="submit" class="btn primary">Create</button>
      </div>
    </form>
  </dialog>

  <dialog id="finding-dialog" class="full">
    <form id="finding-form">
      <h2 id="finding-title">New finding</h2>

      <div id="photo-preview" class="photo-preview photo-wrap" hidden>
        <img id="photo-img" alt="Finding photo">
        <div id="photo-stamp" class="stamp" hidden></div>
      </div>
      <div class="photo-buttons">
        <label class="btn outline">
          <input id="photo-camera" type="file" accept="image/*" capture="environment" hidden>
          Take photo
        </label>
        <label class="btn outline">
          <input id="photo-library" type="file" accept="image/*" hidden>
          Choose photo
        </label>
      </div>
      <p id="location-status" class="hint" hidden></p>
      <p id="photo-error" class="error" hidden></p>

      <label class="label" for="finding-issue">Issue</label>
      <select id="finding-issue" class="field" required></select>

      <label class="label" for="finding-zone">Zone</label>
      <input id="finding-zone" class="field" type="text" inputmode="numeric" autocomplete="off" maxlength="20" placeholder="No zone">

      <label class="label" for="finding-note">Note <span class="optional">(optional)</span></label>
      <textarea id="finding-note" class="field" rows="3" maxlength="2000"></textarea>

      <div class="actions">
        <button id="finding-delete" type="button" class="btn danger-text start" hidden>Delete</button>
        <button type="button" class="btn" onclick="this.closest('dialog').close('cancel')">Cancel</button>
        <button id="finding-save" type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="menu-dialog" class="sheet">
    <form method="dialog">
      <h2 id="menu-title"></h2>
      <div id="menu-items"></div>
    </form>
  </dialog>

  <dialog id="confirm-dialog">
    <form method="dialog">
      <h2 id="confirm-title">Delete</h2>
      <p id="confirm-text"></p>
      <div class="actions">
        <button class="btn" value="cancel">Cancel</button>
        <button id="confirm-ok" class="btn danger" value="ok">Delete</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
