<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e7490">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wet Check">
  <title>Wet Check</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <button id="back" class="icon-btn" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="bar-text">
      <nav id="crumbs" class="crumbs" hidden></nav>
      <h1 id="title">Properties</h1>
    </div>
  </header>

  <main>
    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>No folders yet. Tap <strong>New folder</strong> to add one.</p>
  </main>

  <button id="new-folder" class="fab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    New folder
  </button>

  <dialog id="name-dialog">
    <form id="name-form">
      <h2 id="name-title">New folder</h2>
      <input id="name-input" type="text" autocomplete="off" autocapitalize="words" enterkeyhint="done" placeholder="Folder name" required maxlength="120">
      <div class="actions">
        <button type="button" class="btn" onclick="this.closest('dialog').close('cancel')">Cancel</button>
        <button id="name-submit" type="submit" class="btn primary">Create</button>
      </div>
    </form>
  </dialog>

  <dialog id="menu-dialog" class="sheet">
    <form method="dialog">
      <h2 id="menu-title"></h2>
      <button class="sheet-item" value="rename">Rename</button>
      <button class="sheet-item danger" value="delete">Delete</button>
      <button class="sheet-item" value="cancel">Cancel</button>
    </form>
  </dialog>

  <dialog id="confirm-dialog">
    <form method="dialog">
      <h2>Delete folder</h2>
      <p id="confirm-text"></p>
      <div class="actions">
        <button class="btn" value="cancel">Cancel</button>
        <button class="btn danger" value="ok">Delete</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
